name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            9.0.x

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            v=$(date -u '+%Y.%-m%d.%-H%M.0')
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Jellyfin
        run: |
          dotnet publish Emby.SubtitleCat/Emby.SubtitleCat.csproj \
            --configuration Release \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            --output out-jellyfin

      - name: Build Emby
        run: |
          dotnet publish Emby.SubtitleCat/Emby.SubtitleCat.csproj \
            --configuration Release.Emby \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:ContinuousIntegrationBuild=true \
            --output out-emby

      - name: Package
        run: |
          mkdir -p dist
          zip -j "dist/Jellyfin.SubtitleCat_${{ steps.ver.outputs.version }}.zip" \
            out-jellyfin/Jellyfin.SubtitleCat.dll \
            out-jellyfin/Jellyfin.SubtitleCat.pdb
          zip -j "dist/Emby.SubtitleCat_${{ steps.ver.outputs.version }}.zip" \
            out-emby/Emby.SubtitleCat.dll \
            out-emby/Emby.SubtitleCat.pdb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleCat_${{ steps.ver.outputs.version }}
          path: dist/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
